[project]
name = "trace2evals"
version = "0.2.0"
description = "Demo: turn agent traces into a versioned regression eval suite with a CI gate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-sdk>=1.27.0",
]

[project.optional-dependencies]
live = ["openai>=2.0.0"]

[project.scripts]
trace2evals = "trace2evals.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trace2evals"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
