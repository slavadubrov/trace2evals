name: eval-gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: make check
      - run: make demo
      - run: uv build
      - name: Verify installed wheel outside checkout
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check/bin/python dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/trace2evals evaluate --report wheel-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-${{ matrix.python }}
          path: data/demo/*.json
